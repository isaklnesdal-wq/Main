    </svg>

// ---------- BlurText ----------
function BlurText({ text, className }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setVisible(true);
        });
      },
      { threshold: 0.1 }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  const words = text.split(' ');

  return (
    <p
      ref={ref}
      className={className}
      style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
    >
      {words.map((word, i) => (
        <motion.span
          key={i}
          initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
          animate={visible ? {
            filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
            opacity: [0, 0.5, 1],
            y: [50, -5, 0],
          } : {}}
          transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: (i * 100) / 1000 }}
          style={{ display: 'inline-block', marginRight: '0.28em' }}
        >
          {word}
        </motion.span>
      ))}
    </p>
  );
}

}

            transition={{ duration: 0.8, ease: 'easeOut', delay: 0.8 }}
            className="mt-4 text-sm md:text-base text-white max-w-2xl text-center font-body font-light leading-tight"

            Flightlab er den nye discgolf-butikken for Norge og Norden. Kvalitetsutstyr fra

            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
            transition={{ duration: 0.8, ease: 'easeOut', delay: 1.1 }}
            className="flex items-center gap-6 mt-6"
          >
            <a
              href="#interesse"

          </motion.div>

          <motion.div
            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
            transition={{ duration: 0.8, ease: 'easeOut', delay: 1.3 }}
            className="flex items-stretch gap-4 mt-8"
          >
            <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem]">
              <ClockIcon className="h-7 w-7 text-white" />
              <div className="font-heading italic text-white text-4xl tracking-[-1px] leading-none mt-4">179 kr</div>
              <div className="text-xs text-white font-body font-light mt-2">Pris Per Disc</div>
            </div>
            <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem]">
              <GlobeIcon className="h-7 w-7 text-white" />
              <div className="font-heading italic text-white text-4xl tracking-[-1px] leading-none mt-4">1–3 Dager</div>
              <div className="text-xs text-white font-body font-light mt-2">Levering i Norden</div>
            </div>
          </motion.div>
        </div>

        <motion.div
          initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
          animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
          transition={{ duration: 0.8, ease: 'easeOut', delay: 1.4 }}

        >
          <div className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white">
            Vi samarbeider med ledende discgolf-merker
          </div>
          <div className="flex items-center gap-12 md:gap-16 flex-wrap justify-center px-4">
            {['Discmania', 'Kastaplast', 'Latitude 64', 'Westside', 'Dynamic Discs'].map((name) => (
              <span key={name} className="font-heading italic text-white text-2xl md:text-3xl tracking-tight">
