// ---------- BlurText ----------
function BlurText({ text, className }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setVisible(true);
        });
      },
      { threshold: 0.1 }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  const words = text.split(' ');

  return (
    <p
      ref={ref}
      className={className}
      style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
    >
      {words.map((word, i) => (
        <motion.span
          key={i}
          initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
          animate={visible ? {
            filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
            opacity: [0, 0.5, 1],
            y: [50, -5, 0],
          } : {}}
          transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: (i * 100) / 1000 }}
          style={{ display: 'inline-block', marginRight: '0.28em' }}
        >
          {word}
        </motion.span>
      ))}
    </p>
  );
}

// ---------- Reveal (scroll-triggered fade/blur-in for sections) ----------
function Reveal({ children, delay = 0, className }) {
  return (
    <motion.div
      className={className}
      initial={{ filter: 'blur(10px)', opacity: 0, y: 30 }}
      whileInView={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
      viewport={{ once: true, amount: 0.2 }}
      transition={{ duration: 0.8, ease: 'easeOut', delay }}
    >
      {children}
    </motion.div>
  );
}

// Deterministisk RNG så skogen ser lik ut hver gang
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- ThreeIntro: ekte WebGL-skog i førsteperson ----------
function ThreeIntro({ phase, onFail }) {
  const mountRef = useRef(null);
  const phaseRef = useRef(phase);
  const flyStartRef = useRef(0);
  const impactStartRef = useRef(0);

  useEffect(() => {
    if (phase === 'flying' && !flyStartRef.current) flyStartRef.current = performance.now();
    if (phase === 'impact' && !impactStartRef.current) impactStartRef.current = performance.now();
    phaseRef.current = phase;
  }, [phase]);

  useEffect(() => {
    let renderer = null;
    let onResize = null;
    const el = mountRef.current;
    try {
      if (!window.THREE || !el) throw new Error('THREE unavailable');
      const THREE = window.THREE;
      const rand = mulberry32(42);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(el.clientWidth || window.innerWidth, el.clientHeight || window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      el.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a2015);
      scene.fog = new THREE.FogExp2(0x0c2417, 0.026);

      const camera = new THREE.PerspectiveCamera(
        72,
        (el.clientWidth || window.innerWidth) / (el.clientHeight || window.innerHeight),
        0.1,
        500
      );
      camera.position.set(0, 1.7, 0);

      // Lys: lav kveldssol, kjølig himmel, varm glød
      const sun = new THREE.DirectionalLight(0xffd9a0, 2.4);
      sun.position.set(-25, 18, -70);
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0x2a4d3a, 1.1));
      scene.add(new THREE.HemisphereLight(0x9fd8b5, 0x081a10, 0.7));

      // Solskive langt bak kurven
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(7, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffc27a, fog: false, transparent: true, opacity: 0.85 })
      );
      glow.position.set(-16, 9, -140);
      scene.add(glow);

      // Bakke
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 400),
        new THREE.MeshStandardMaterial({ color: 0x11301f, roughness: 1 })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Fairway-stripe (litt lysere gress der du kaster)
      const fairway = new THREE.Mesh(
        new THREE.PlaneGeometry(4.5, 90),
        new THREE.MeshStandardMaterial({ color: 0x1a4229, roughness: 1 })
      );
      fairway.rotation.x = -Math.PI / 2;
      fairway.position.set(0, 0.01, -42);
      scene.add(fairway);

      // 90 grantrær med stamme og tre kjegle-lag, spredt langs korridoren
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.95 });
      const leafA = new THREE.MeshStandardMaterial({ color: 0x14442a, roughness: 0.9 });
      const leafB = new THREE.MeshStandardMaterial({ color: 0x1b5a36, roughness: 0.9 });
      for (let i = 0; i < 90; i++) {
        const z = -5 - rand() * 95;
        const side = rand() < 0.5 ? -1 : 1;
        const x = side * (2.8 + rand() * 13);
        const h = 4 + rand() * 7;
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.22, h * 0.35, 6), trunkMat);
        trunk.position.y = h * 0.175;
        tree.add(trunk);
        for (let k = 0; k < 3; k++) {
          const cone = new THREE.Mesh(
            new THREE.ConeGeometry((1.7 - k * 0.45) * (0.8 + rand() * 0.4), h * 0.38, 7),
            k % 2 ? leafA : leafB
          );
          cone.position.y = h * 0.32 + k * h * 0.2;
          tree.add(cone);
        }
        tree.position.set(x, 0, z);
        tree.rotation.y = rand() * Math.PI;
        scene.add(tree);
      }

      // Discgolf-kurv i metall ved z = -40
      const metal = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.9, roughness: 0.35 });
      const basket = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.5, 10), metal);
      pole.position.y = 0.75;
      basket.add(pole);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.05, 12), metal);
      hub.position.y = 1.48;
      basket.add(hub);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.02, 8, 24), metal);
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 1.02;
      basket.add(rim);
      const tray = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.32, 0.26, 20, 1, true),
        new THREE.MeshStandardMaterial({ color: 0xb0b0b0, metalness: 0.85, roughness: 0.45, side: THREE.DoubleSide })
      );
      tray.position.y = 0.88;
      basket.add(tray);
      const chains = [];
      for (let i = 0; i < 12; i++) {
        const th = (i / 12) * Math.PI * 2;
        const g = new THREE.Group();
        g.position.set(Math.cos(th) * 0.06, 1.46, Math.sin(th) * 0.06);
        const link = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.46, 6), metal);
        link.position.y = -0.23;
        g.add(link);
        g.rotation.z = -Math.cos(th) * 0.6;
        g.rotation.x = Math.sin(th) * 0.6;
        g.userData.bz = g.rotation.z;
        g.userData.bx = g.rotation.x;
        basket.add(g);
        chains.push(g);
      }
      basket.position.set(0, 0, -40);
      scene.add(basket);

      // Blitslys ved treff
      const flash = new THREE.PointLight(0xffd34d, 0, 12);
      flash.position.set(0, 1.3, -39.4);
      scene.add(flash);

      // Discen — oransje driver
      const disc = new THREE.Group();
      const discBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.145, 0.155, 0.022, 32),
        new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.35 })
      );
      disc.add(discBody);
      const stamp = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 0.002, 24),
        new THREE.MeshStandardMaterial({ color: 0x1b4332, roughness: 0.5 })
      );
      stamp.position.y = 0.013;
      disc.add(stamp);
      disc.visible = false;
      scene.add(disc);

      const shakeRand = mulberry32(7);
      const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);

      const loop = () => {
        const now = performance.now();
        const ph = phaseRef.current;
        const flying = ph === 'flying';
        const flyP = flying ? Math.min((now - flyStartRef.current) / 2600, 1) : ph === 'title' ? 0 : 1;
        const e = easeOutCubic(flyP);

        // Kamera: flyr fremover langs fairwayen, med gangbob
        camera.position.z = -34.5 * e;
        camera.position.y = 1.7 + Math.sin(now * 0.004) * 0.03 + (flying ? Math.sin(now * 0.013) * 0.09 : 0);
        camera.position.x = flying ? Math.sin(now * 0.009) * 0.06 : 0;

        // Kamerarist ved treff
        if (impactStartRef.current) {
          const sp = (now - impactStartRef.current) / 550;
          if (sp < 1) {
            const a = (1 - sp) * 0.12;
            camera.position.x += (shakeRand() - 0.5) * a;
            camera.position.y += (shakeRand() - 0.5) * a;
          }
        }
        camera.lookAt(0, 1.25, camera.position.z - 9);

        // Discen: slippes fra hånden, S-kurve inn i kjettingene
        if (ph !== 'title') {
          const hitDone = ph !== 'flying' && ph !== 'title';
          disc.visible = !hitDone || flyP < 1 ? true : false;
          if (flying) {
            disc.visible = true;
            const dz = -1.4 + (-39.6 + 1.4) * e;
            disc.position.set(
              (1 - flyP) * 0.35 + Math.sin(flyP * Math.PI) * 0.85,
              1.45 + Math.sin(flyP * Math.PI) * 1.15 - flyP * 0.25,
              dz
            );
            disc.rotation.y += 0.4;
            disc.rotation.x = 0.1 + Math.sin(now * 0.02) * 0.06;
            disc.rotation.z = Math.sin(flyP * Math.PI) * -0.22;
          } else {
            disc.visible = false;
          }
        }

        // Kjettinger: rister i 0.9s etter treff
        if (impactStartRef.current) {
          const cp = (now - impactStartRef.current) / 900;
          const decay = Math.max(0, 1 - cp);
          chains.forEach((g, i) => {
            g.rotation.z = g.userData.bz + Math.sin(now * 0.045 + i * 1.7) * 0.3 * decay;
            g.rotation.x = g.userData.bx + Math.cos(now * 0.05 + i * 2.1) * 0.25 * decay;
          });
          flash.intensity = Math.max(0, 1 - (now - impactStartRef.current) / 450) * 26;
        }

        renderer.render(scene, camera);
      };
      renderer.setAnimationLoop(loop);

      onResize = () => {
        const w = el.clientWidth || window.innerWidth;
        const h = el.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      };
      window.addEventListener('resize', onResize);
    } catch (err) {
      if (renderer) {
        try { renderer.dispose(); } catch (e2) {}
      }
      onFail();
      return;
    }

    return () => {
      if (onResize) window.removeEventListener('resize', onResize);
      if (renderer) {
        renderer.setAnimationLoop(null);
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentElement) {
          renderer.domElement.parentElement.removeChild(renderer.domElement);
        }
      }
    };
  }, []);

  return <div ref={mountRef} className="absolute inset-0" />;
}

            men utvalget henger etter. Norske spillere har måttet velge mellom et tynt
            lokalt sortiment og store svenske butikker med toll, gebyrer og upersonlig
            service. Vi mente det fantes en bedre vei — og bestemte oss for å bygge den.
          </p>
          <p className="mt-4 text-sm md:text-base text-white/80 font-body font-light leading-relaxed max-w-[52ch]">
            Misjonen vår er å gjøre discgolf tilgjengelig for alle i Norge: riktig
            utstyr, til riktig pris, levert raskt. Navnet sier resten — vi er
            besatt av hvordan discer flyr, helt ned til flight-tallene som pryder
            designet vårt.
          </p>
          <p className="mt-4 text-sm md:text-base text-white/60 font-body font-light leading-relaxed max-w-[52ch]">
            Det som skiller oss fra alle alternativer: én fast, lav pris per disc,
            nordisk lager uten tollgrense, og satsing på det ingen andre tilbyr —
            abonnement, baneutstyr og custom-discer. Du handler trygt hos folk som
            spiller selv.
          </p>
        </Reveal>

        <div className="flex flex-col gap-6 lg:pt-24">
          {VALUES.map(({ title, body }, i) => (
            <Reveal key={title} delay={i * 0.12}>
              <div className="liquid-glass rounded-[1.25rem] p-6 flex items-start gap-5">
                <span className="font-heading italic text-signal text-3xl leading-none shrink-0">

                  <p className="mt-2 text-sm text-white/70 font-body font-light leading-snug">{body}</p>
                </div>
              </div>
            </Reveal>
          ))}
        </div>
      </div>
    </section>
  );
}

// ---------- Final CTA (email interest list) ----------
function FinalCta() {
  const [email, setEmail] = useState('');
  const [submitted, setSubmitted] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (email.trim()) setSubmitted(true);
  };

  return (
    <section id="interesse" className="relative w-full bg-black px-8 md:px-16 lg:px-20 py-28 border-t border-white/5 overflow-hidden">
      <div
        className="absolute inset-0 z-0 pointer-events-none"
        style={{ background: 'radial-gradient(ellipse 60% 50% at 50% 60%, rgba(27,67,50,0.45) 0%, rgba(0,0,0,0) 70%)' }}
      />
      <div className="relative z-10 flex flex-col items-center text-center">
        <Reveal>
          <h2 className="font-heading italic text-white text-5xl md:text-6xl lg:text-7xl leading-[0.9] tracking-[-2px]">
            Bli Med Fra Starten
          </h2>
          <p className="mt-5 text-sm md:text-base text-white/70 font-body font-light max-w-xl leading-snug mx-auto">
            Vi åpner snart. Meld deg på listen, så får du beskjed først — pluss
            rabatt på din første ordre.
          </p>
        </Reveal>

        <Reveal delay={0.15} className="w-full max-w-md mt-9">
          {submitted ? (
            <div className="liquid-glass rounded-full px-6 py-4 text-sm text-white font-body">
              Takk! Vi sier ifra så fort dørene åpner. 🥏
            </div>
          ) : (
            <form onSubmit={handleSubmit} className="liquid-glass rounded-full p-1.5 flex items-center gap-2">
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="din@epost.no"
                className="flex-1 bg-transparent outline-none border-none text-sm text-white placeholder-white/40 font-body px-4 py-2 min-w-0"
              />
              <button
                type="submit"
                className="rounded-full px-5 py-2.5 text-sm font-medium whitespace-nowrap text-white shrink-0"
                style={{ background: '#FF6B35' }}
              >
                Meld Interesse
              </button>
            </form>
          )}
        </Reveal>
      </div>
    </section>
  );
}

// ---------- App ----------
function App() {
  const [introDone, setIntroDone] = useState(false);

  // Lås skrolling til introen er sett ferdig
  useEffect(() => {
    document.body.style.overflow = introDone ? '' : 'hidden';
    return () => {
      document.body.style.overflow = '';
    };
  }, [introDone]);

  return (
    <div>
      <AnimatePresence>
        {!introDone && <IntroOverlay onDone={() => setIntroDone(true)} />}
      </AnimatePresence>
      <DiscHero />
      <UspStrip />
      <Products />
      <Capabilities />
      <Services />
      <About />
      <Testimonials />
      <Faq />
      <FinalCta />
      <Footer />
    </div>
  );
}

root.render(<App />);
